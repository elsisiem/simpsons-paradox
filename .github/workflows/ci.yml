name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kidney stone simulation
        run: python simpsons_paradox.py
      - name: Beta-blocker simulation
        run: python beta_blocker.py
